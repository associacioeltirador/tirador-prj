<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirador - Accés de Socis</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1b4d3e;
        }
        .btn-tirador {
            background-color: #1b4d3e;
            color: #ffffff;
        }
        .btn-tirador:hover {
            background-color: #123529;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Targeta central blanca -->
    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-2xl text-slate-800">
        
        <!-- Capçalera -->
        <div class="text-center mb-8 flex flex-col items-center">
            <div class="mb-4 w-24 h-24 rounded-full bg-emerald-100 text-emerald-800 shadow-inner flex items-center justify-center border border-emerald-200 text-3xl font-bold">
                🍺
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Associació El Tirador</h1>
            <p id="subtittle" class="text-sm text-emerald-700 font-medium mt-1">Portal de Socis - Accés Privat</p>
        </div>

        <!-- Formulari de Login -->
        <div id="loginSection">
            <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)" novalidate>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Usuari / Correu electrònic</label>
                    <input type="email" id="username" required 
                        oninput="validarEmailInput()"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 focus:outline-none text-slate-900 placeholder-slate-400 transition duration-150"
                        placeholder="soci1@eltirador.com">
                    
                    <p id="emailError" class="text-rose-600 text-xs mt-1.5 hidden font-medium flex items-center gap-1">
                        <span>⚠️</span> El format del correu electrònic no és vàlid (ex: nom@domini.com).
                    </p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Contrasenya</label>
                    <input type="password" id="password" required 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 focus:outline-none text-slate-900 placeholder-slate-400 transition duration-150"
                        placeholder="••••••••">
                </div>

                <div id="errorMsg" class="text-rose-600 text-sm hidden text-center bg-rose-50 py-2.5 rounded-xl border border-rose-200 font-medium"></div>

                <button type="submit" id="submitBtn"
                    class="w-full py-3.5 btn-tirador font-semibold rounded-xl transition duration-200 shadow-md cursor-pointer">
                    Iniciar Sessió
                </button>
            </form>
        </div>

        <!-- Panell del Soci (Post-Login) -->
        <div id="dashboardSection" class="hidden space-y-6">
            <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                <h3 class="text-base font-bold text-slate-900 mb-3 border-b border-slate-200 pb-2">Les teves Dades Personals</h3>
                <div class="space-y-2.5 text-sm text-slate-700">
                    <p class="flex justify-between"><strong class="text-slate-500">Nom:</strong> <span id="valNom" class="font-semibold text-slate-900"></span></p>
                    <p class="flex justify-between"><strong class="text-slate-500">Email:</strong> <span id="valEmail" class="font-semibold text-slate-900"></span></p>
                    <p class="flex justify-between"><strong class="text-slate-500">Telèfon:</strong> <span id="valTelefon" class="font-semibold text-slate-900"></span></p>
                    <p class="flex justify-between"><strong class="text-slate-500">Estat:</strong> <span id="valEstat" class="text-emerald-700 font-bold"></span></p>
                </div>
            </div>
            
            <button onclick="logout()" 
                class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition duration-200 text-sm cursor-pointer border border-slate-300">
                Tancar Sessió
            </button>
        </div>

        <!-- Peu de pàgina -->
        <div class="mt-8 text-center text-xs text-slate-400 font-medium">
            Powered by Associació El Tirador
        </div>
    </div>

    <!-- Script de Comunicació via API REST -->
    <script>
        // URL DEL BACKEND DE GOOGLE APPS SCRIPT
        const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzwQKkdc9IxveNSbDg1HEe4D2no-t78kJFQwf-VX_OvMhgpKaYzQL2A4yj2tjENgHJ6VA/exec";

        function validarEmailInput() {
            const userInput = document.getElementById('username');
            const emailError = document.getElementById('emailError');
            const emailValue = userInput.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailValue === "") {
                emailError.classList.add('hidden');
                userInput.classList.remove('border-rose-500', 'focus:ring-rose-500', 'focus:border-rose-500');
                userInput.classList.add('border-slate-300', 'focus:ring-emerald-600', 'focus:border-emerald-600');
                return false;
            }

            if (!emailRegex.test(emailValue)) {
                emailError.classList.remove('hidden');
                userInput.classList.remove('border-slate-300', 'focus:ring-emerald-600', 'focus:border-emerald-600');
                userInput.classList.add('border-rose-500', 'focus:ring-rose-500', 'focus:border-rose-500');
                return false;
            } else {
                emailError.classList.add('hidden');
                userInput.classList.remove('border-rose-500', 'focus:ring-rose-500', 'focus:border-rose-500');
                userInput.classList.add('border-slate-300', 'focus:ring-emerald-600', 'focus:border-emerald-600');
                return true;
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            if (!validarEmailInput()) {
                document.getElementById('username').focus();
                return;
            }

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = "Verificant...";

            try {
                const payload = JSON.stringify({ usuari: user, password: pass });

                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    mode: "cors",
                    redirect: "follow",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: payload
                });

                if (!response.ok) {
                    throw new Error("HTTP error! Status: " + response.status);
                }

                const data = await response.json();

                btn.disabled = false;
                btn.textContent = "Iniciar Sessió";

                if (data.success) {
                    sessionStorage.setItem('tirador_session_token', data.token);
                    sessionStorage.setItem('tirador_user_email', data.soci.email);

                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    document.getElementById('subtittle').textContent = "Panell de Control del Soci";

                    document.getElementById('valNom').textContent = data.soci.nom;
                    document.getElementById('valEmail').textContent = data.soci.email;
                    document.getElementById('valTelefon').textContent = data.soci.telefon;
                    document.getElementById('valEstat').textContent = data.soci.estat;
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.classList.remove('hidden');
                }

            } catch (error) {
                console.error("Error detallat de connexió:", error);
                btn.disabled = false;
                btn.textContent = "Iniciar Sessió";
                errorDiv.textContent = "Error de connexió amb el servidor.";
                errorDiv.classList.remove('hidden');
            }
        }

        function logout() {
            sessionStorage.removeItem('tirador_session_token');
            sessionStorage.removeItem('tirador_user_email');

            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('subtittle').textContent = "Portal de Socis - Accés Privat";
            document.getElementById('loginForm').reset();
            validarEmailInput();
        }
    </script>
</body>
</html>
